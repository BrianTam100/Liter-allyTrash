<section class="panel scanner-panel" id="scanner" aria-labelledby="scanner-title">
  <div class="panel-heading scanner-heading"><h2 id="scanner-title">Scanner</h2><div class="scanner-status"><span id="detector-dot" aria-hidden="true"></span><span id="detector-status">Connecting to scanner…</span><button id="model-load" class="text-button" type="button" hidden>Prepare scanner</button></div></div>
  <div class="scanner-grid">
    <div class="capture">
      <div class="scan-toolbar"><label for="source">Image source</label><select id="source"><option value="browser">This device’s camera</option><option value="server">Connected / Pi camera</option><option value="upload">Upload a photo</option></select></div>
      <div class="viewfinder"><video id="video" autoplay muted playsinline hidden></video><img id="preview" alt="Item being identified" hidden><div id="placeholder"><p>Show one item against a plain background.</p></div><div id="guide" aria-hidden="true" hidden><span>ONE ITEM AT A TIME</span></div></div>
      <div class="scan-buttons"><button class="button primary" id="start" type="button" disabled>Start camera</button><button id="stop" class="button outline" type="button" hidden>Stop scanning</button><label id="upload-label" class="button outline scan-upload" hidden>Choose photo<input id="file" type="file" accept="image/*"></label><span id="capture-note" class="form-note">Images are processed here and aren’t saved.</span></div>
    </div>
    <div class="scan-result">
      <div class="result-main" aria-live="polite"><h3 id="label">No item yet</h3><span id="result-bin" class="scan-bin" hidden></span><p id="hint"></p></div>
      <div class="match"><div><span id="match-label">Relative match</span><strong id="score">—</strong></div><progress id="score-bar" value="0" max="1" aria-labelledby="match-label"></progress></div>
      <div class="scan-candidates"><span class="eyebrow">OTHER MATCHES</span><ul id="candidates"><li>Waiting for an image<span>—</span></li></ul></div>
      <button id="use-result" class="button primary full" type="button" disabled>{{ icon('plus') }} Use recognized item</button><span id="timing" class="form-note">Recognition happens locally.</span>
    </div>
  </div>
  <p id="message" class="form-feedback" role="status" aria-live="polite"></p>
  <div class="scan-footnote"><span id="lid-status">Checking bin lids…</span><label class="lid-toggle" id="lid-toggle" hidden><input type="checkbox" id="auto-lid"> Open lids automatically</label></div>
</section>
